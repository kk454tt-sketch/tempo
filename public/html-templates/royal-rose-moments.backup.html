.base{transition:opacity .15s}
.p{transition:transform 1.3s cubic-bezier(.7,0,.2,1),filter .4s}
.p i{position:absolute;inset:0}
.l{z-index:5;transform-origin:0 50%}.l i{clip-path:polygon(0 0,10% 0,51% 38%,73% 51%,51% 66%,0 100%)}
.r{z-index:3;transform-origin:100% 50%}.r i{clip-path:polygon(88% 0,100% 0,100% 100%,84% 100%,47% 60%,47% 40%)}
.t{z-index:2;transform-origin:50% 0}.t i{clip-path:polygon(9% 0,90% 0,50% 40%)}
.b{z-index:2;transform-origin:50% 100%}.b i{clip-path:polygon(0 100%,86% 100%,50% 61%)}
.open .base{opacity:0}
.open .p{filter:drop-shadow(0 8px 20px rgba(0,0,0,.6))}
.open .l{transform:translateX(-112%) rotate(-5deg)}
.open .r{transform:translateX(112%) rotate(4deg);transition-delay:.06s}
.open .t{transform:translateY(-112%) rotate(-3deg);transition-delay:.2s}
.open .b{transform:translateY(90%);transition-delay:.32s}
.open .liner{opacity:0;transition:opacity .9s ease .9s}
.shine{z-index:6;left:30%;top:31%;right:auto;bottom:auto;width:40%;aspect-ratio:1;border-radius:50%;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.3) 50%,transparent 62%) 150% 0/300% 100%;animation:sh 3.2s ease-in-out infinite}
@keyframes sh{to{background-position:-50% 0}}
.hint{z-index:7;top:auto;bottom:6%;text-align:center;letter-spacing:.4em;text-transform:uppercase;font-size:13px;color:var(--gold);animation:bl 2.2s ease-in-out infinite;transition:opacity .3s}
@keyframes bl{50%{opacity:.3}}
.open .hint,.open .shine{opacity:0}

/* HERO (the card inside) */
main{position:relative;z-index:2}
.hero{position:relative;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 22px;opacity:0;transform:scale(.9);transition:opacity 1.4s ease .25s,transform 1.8s cubic-bezier(.2,.7,.2,1) .15s}
.opened .hero{opacity:1;transform:none}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:
radial-gradient(55% 38% at 0% 18%,rgba(52,120,90,.55),transparent 70%),radial-gradient(48% 40% at 100% 8%,rgba(52,120,90,.5),transparent 70%),
radial-gradient(60% 36% at 100% 82%,rgba(40,100,74,.55),transparent 70%),radial-gradient(50% 36% at 0% 100%,rgba(52,120,90,.6),transparent 70%),
radial-gradient(70% 50% at 50% 45%,#11331f,transparent 80%)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(0,0,0,.65),transparent 60%);opacity:0}
.opened .hero::after{animation:swp 2.4s ease .4s}
@keyframes swp{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(-40%)}}
.bf{width:150px;margin-bottom:26px;animation:fl 5s ease-in-out infinite;opacity:0;transition:opacity 1.2s ease 2s}
.go .bf{opacity:1}
@keyframes fl{50%{translate:0 -12px;rotate:3deg}}
.wg{transform-box:view-box;transform-origin:100px 70px;animation:fp 1.5s ease-in-out infinite}
@keyframes fp{50%{transform:scaleX(.45)}}
.sp{position:absolute;width:120px;opacity:.85;transform-origin:50% 100%;animation:sw 7s ease-in-out infinite}
.sp1{right:-18px;top:-10px;rotate:160deg}.sp2{left:-20px;bottom:-14px;rotate:-20deg;animation-delay:-3s}
@keyframes sw{50%{transform:rotate(4deg)}}
.ln{display:block;color:var(--gold);text-shadow:0 0 28px rgba(230,207,149,.25)}
.ln span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(12px)}
.go .ln span{animation:bi 1.1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*.08s + var(--b,0s))}
@keyframes bi{to{opacity:1;filter:blur(0);transform:none}}
.cap{font-size:clamp(38px,11vw,64px);letter-spacing:.14em;margin-right:-.14em}
.it{font:italic 30px 'Cormorant Garamond',serif;margin:2px 0}
.nm{font:400 clamp(70px,21vw,112px)/1 'Great Vibes',cursive}
.fade{opacity:0;transform:translateY(14px);transition:opacity 1.2s ease var(--d),transform 1.2s ease var(--d)}
.go .fade{opacity:1;transform:none}
.sub{margin:22px 0 0;letter-spacing:.3em;text-transform:uppercase;font-size:13px;color:var(--mut)}
.cd{display:flex;margin-top:18px}
.cd div{padding:0 14px;border-left:1px solid var(--line)}.cd div:first-child{border:0}
.cd b{display:block;font-size:30px;font-weight:600;color:var(--gold)}
.cd span{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--mut)}
.cue{margin-top:34px;width:1px;height:46px;background:linear-gradient(var(--gold),transparent);animation:cu 2s ease-in-out infinite}
@keyframes cu{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* SECTIONS */
.col{max-width:620px;margin:0 auto;padding:70px 22px;text-align:center}
.rv{opacity:0;filter:blur(8px);transform:translateY(26px);transition:opacity 1s ease var(--d,0s),filter 1s ease var(--d,0s),transform 1s ease var(--d,0s)}
.rv.in{opacity:1;filter:none;transform:none}
h2{font:400 52px/1.1 'Great Vibes',cursive;margin:0 0 26px}
.dow{letter-spacing:.4em;font-size:13px;color:var(--mut)}
.num{font:600 120px/1 'Cormorant Garamond',serif}
.mon{letter-spacing:.35em;font-size:16px;color:var(--gold)}
.hr{width:60px;height:1px;background:var(--gd);margin:30px auto}
.vn{font-size:30px;font-weight:600}
.lk{display:inline-block;margin:10px 12px 0;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:13px;text-decoration:none;border-bottom:1px solid var(--gd);padding-bottom:3px}
.photos{display:flex;gap:14px;align-items:flex-end}
.ph{position:relative;flex:1;height:230px;display:grid;place-items:center;border-radius:999px 999px 16px 16px;border:1px solid var(--gd);box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--line);background:rgba(255,255,255,.04) center/cover;overflow:hidden;cursor:pointer;color:var(--mut);font-size:13px;letter-spacing:.15em;text-transform:uppercase;translate:0 var(--py,0px)}
.ph:nth-child(2){height:290px}
.ph input{display:none}.ph.has span{display:none}
.ph span::before{content:"+";display:block;font-size:40px;font-weight:400;color:var(--gold);line-height:1;margin-bottom:6px}
.note{color:var(--mut);font-style:italic;font-size:15px;margin:22px 0 0}
.f{display:block;text-align:left;margin-bottom:22px;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--mut)}
.f input,.f select,.f textarea{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--gd);border-radius:0;color:var(--ink);font:22px 'Cormorant Garamond',serif;padding:8px 0;outline:0}
.f select option{background:var(--bg)}
.f input:focus,.f textarea:focus{border-color:var(--gold)}
.chips{display:flex;gap:12px;margin-bottom:26px}
.chips label{flex:1}.chips input{position:absolute;opacity:0}
.chips span{display:block;padding:13px 4px;border:1px solid var(--gd);border-radius:999px;cursor:pointer;font-size:18px;transition:.3s}
.chips input:checked+span{background:var(--gold);color:#12261b;font-weight:600}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:999px;background:linear-gradient(110deg,#b8954c,#f4e2ab 50%,#b8954c);background-size:200%;color:#12261b;font:600 17px 'Cormorant Garamond',serif;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background-position .6s}
.btn:hover{background-position:100%}
.thanks{display:none}
.thanks h3{font:400 52px 'Great Vibes',cursive;margin:0}
footer{text-align:center;color:var(--mut);font-style:italic;padding:10px 0 50px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
<style id="tempo-responsive-override">
  html, body {
    max-width: 100vw !important;
    overflow-x: hidden !important;
    box-sizing: border-box !important;
  }
  *, *::before, *::after {
    box-sizing: border-box !important;
  }
  /* Prevent animated ping or oversized elements from overflowing viewport */
  .animate-ping {
    max-width: 100% !important;
  }
</style>

</head>
<body class="locked">
<canvas id="dust"></canvas>

<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4e2ab"/><stop offset="1" stop-color="#b8954c"/></linearGradient>
<path id="w" d="M100 68C112 22 165 2 190 22C200 48 150 74 100 71ZM100 75C138 78 168 98 152 126C132 138 106 104 100 75Z" fill="rgba(230,207,149,.14)" stroke="url(#g)" stroke-width="1.6" stroke-linejoin="round"/>
<path id="lf" d="M0 0C10-13 30-13 40 0C30 13 10 13 0 0Z" fill="rgba(230,207,149,.12)" stroke="#d3b570" stroke-width="1"/>
<g id="spr"><path d="M60 250C56 170 72 100 60 6" fill="none" stroke="#d3b570" stroke-width="1.4"/>
<use href="#lf" transform="translate(59 220) rotate(-40)"/><use href="#lf" transform="translate(60 190) rotate(220)"/><use href="#lf" transform="translate(63 155) rotate(-35)"/><use href="#lf" transform="translate(64 120) rotate(215)"/><use href="#lf" transform="translate(63 85) rotate(-30)"/><use href="#lf" transform="translate(61 55) rotate(210)"/><use href="#lf" transform="translate(60 25) rotate(-70)"/></g>
</defs></svg>

<div id="env" role="button" tabindex="0" aria-label="Tap anywhere to open">
  <div class="wrap">
    <div class="liner"></div><div class="base"></div>
    <div class="p b"><i></i></div><div class="p t"><i></i></div><div class="p r"><i></i></div><div class="p l"><i></i></div>
    <div class="shine"></div>
    <div class="hint">Tap anywhere to open</div>
  </div>
</div>

<main>
  <section class="hero" id="hero">
    <svg class="sp sp1" viewBox="0 0 120 260"><use href="#spr"/></svg>
    <svg class="sp sp2" viewBox="0 0 120 260"><use href="#spr"/></svg>
    <svg class="bf" viewBox="0 0 200 140"><g class="wg"><use href="#w"/></g><g class="wg"><use href="#w" transform="translate(200 0) scale(-1 1)"/></g><ellipse cx="100" cy="76" rx="3" ry="26" fill="url(#g)"/></svg>
    <span class="ln cap" data-b="2.2s">CELEBRATE</span>
    <span class="ln it" data-b="3.3s">with</span>
    <span class="ln nm" data-b="3.6s" id="name"></span>
    <p class="sub fade" style="--d:5.2s">turning <b id="age" style="font-weight:600;color:var(--gold)"></b> · <span id="short"></span></p>
    <div class="cd fade" id="cd" style="--d:5.6s"></div>
    <div class="cue fade" style="--d:6s"></div>
  </section>

  <section class="col">
    <div class="rv"><div class="dow" id="dow"></div><div class="num gold" id="day"></div><div class="mon" id="mon"></div><p style="margin:8px 0 0;color:var(--mut)" id="time"></p></div>
    <div class="hr rv"></div>
    <div class="rv"><div class="vn" id="venue"></div><div style="color:var(--mut)" id="addr"></div>
      <a class="lk" id="map" target="_blank" rel="noopener">Location</a><a class="lk" id="cal" target="_blank" rel="noopener">Add to calendar</a></div>
  </section>

  <section class="col">
    <h2 class="gold rv">Our Moments</h2>
    <div class="photos rv">
      <label class="ph"><input type="file" accept="image/*"><span>Add photo</span></label>
      <label class="ph"><input type="file" accept="image/*"><span>Add photo</span></label>
      <label class="ph"><input type="file" accept="image/*"><span>Add photo</span></label>
    </div>
    <p class="note rv">Tap a frame to place your photo.</p>
  </section>

  <section class="col">
    <h2 class="gold rv">RSVP</h2>
    <form id="rsvp" class="rv">
      <label class="f">Your name<input type="text" id="gname" required></label>
      <div class="chips">
        <label><input type="radio" name="a" value="Joyfully accepts" checked><span>I'll be there</span></label>
        <label><input type="radio" name="a" value="Regretfully declines"><span>Can't make it</span></label>
      </div>
      <label class="f">Guests<select id="guests"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label class="f">A little note<textarea id="msg" rows="2"></textarea></label>
      <button class="btn" type="submit">Send RSVP</button>
    </form>
    <div class="thanks" id="thanks"><h3 class="gold">Thank you!</h3><p id="tmsg"></p><a class="btn" id="wa" target="_blank" rel="noopener">Confirm on WhatsApp</a></div>
  </section>
  <footer>With love, <span id="host"></span> 🌹</footer>
</main>

<script>
/* ✏️ EDIT YOUR DETAILS HERE */
const C={name:"Ananya",age:25,date:"2026-11-14T19:00:00",venue:"The Emerald Hall",addr:"Your address, City",phone:"919999999999",host:"Ananya & Family"};
const $=id=>document.getElementById(id),D=new Date(C.date),p=n=>String(n).padStart(2,'0');
const M=D.toLocaleString('en',{month:'long'}).toUpperCase();
$('name').textContent=C.name;$('age').textContent=C.age;$('venue').textContent=C.venue;$('addr').textContent=C.addr;$('host').textContent=C.host;
$('dow').textContent=D.toLocaleString('en',{weekday:'long'}).toUpperCase();$('day').textContent=D.getDate();$('mon').textContent=M+' · '+D.getFullYear();
$('time').textContent=D.toLocaleString('en',{hour:'numeric',minute:'2-digit'})+' onwards';
$('short').textContent=D.getDate()+' '+D.toLocaleString('en',{month:'short'});
$('map').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(C.venue+' '+C.addr);
const f=d=>d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00';
$('cal').href='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(C.name+"'s Birthday")+'&location='+encodeURIComponent(C.venue)+'&dates='+f(D)+'/'+f(new Date(+D+4*36e5));
function tick(){let s=Math.max(0,Math.floor((D-Date.now())/1000));
$('cd').innerHTML=[['Days',s/86400],['Hrs',s%86400/3600],['Min',s%3600/60],['Sec',s%60]].map(x=>`<div><b>${p(Math.floor(x[1]))}</b><span>${x[0]}</span></div>`).join('')}
tick();setInterval(tick,1000);

/* split text into letters for blur-in */
document.querySelectorAll('.ln').forEach(el=>{el.style.setProperty('--b',el.dataset.b||'0s');
el.innerHTML=[...el.textContent].map((c,i)=>`<span style="--i:${i}">${c===' '?'&nbsp;':c}</span>`).join('')});

/* open */
const env=$('env');
function openIt(){
  if(env.classList.contains('open'))return;
  env.classList.add('open');document.body.classList.add('opened');
  setTimeout(()=>$('hero').classList.add('go'),500);
  setTimeout(()=>{env.remove();document.body.classList.remove('locked');
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
    document.querySelectorAll('.rv').forEach(el=>io.observe(el));},1900);
}
env.addEventListener('click',openIt);
env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openIt()}});

/* gold dust */
const cv=$('dust'),x=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const P=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.4,v:Math.random()*.0004+.00012,t:Math.random()*6}));
(function a(){x.clearRect(0,0,W,H);P.forEach(q=>{q.y-=q.v;q.t+=.03;if(q.y<-.02){q.y=1.02;q.x=Math.random()}
x.globalAlpha=.25+.55*Math.abs(Math.sin(q.t));x.fillStyle='#f0dca0';x.beginPath();x.arc(q.x*W+Math.sin(q.t*.5)*10,q.y*H,q.r,0,7);x.fill()});requestAnimationFrame(a)})();

/* photo frames + gentle parallax */
document.querySelectorAll('.ph input').forEach(i=>i.addEventListener('change',()=>{const g=i.files[0];if(!g)return;
const l=i.parentNode;l.style.backgroundImage=`url(${URL.createObjectURL(g)})`;l.classList.add('has')}));
const ph=[...document.querySelectorAll('.ph')];
addEventListener('scroll',()=>{ph.forEach((e,k)=>{const r=e.getBoundingClientRect().top-innerHeight/2;e.style.setProperty('--py',(r*(k===1?-.05:.04)).toFixed(1)+'px')})},{passive:true});

/* RSVP */
$('rsvp').addEventListener('submit',e=>{e.preventDefault();
const n=$('gname').value.trim(),a=document.querySelector('[name=a]:checked').value,m=$('msg').value.trim();
$('wa').href='https://wa.me/'+C.phone+'?text='+encodeURIComponent(`Hi! This is ${n}. ${a} the birthday on ${$('short').textContent}. Guests: ${$('guests').value}.${m?' Note: '+m:''}`);
$('tmsg').textContent=a==='Joyfully accepts'?`Lovely, ${n}! We can't wait to celebrate with you.`:`We'll miss you, ${n}. Thank you for letting us know.`;
$('rsvp').style.display='none';$('thanks').style.display='block';$('thanks').scrollIntoView({behavior:'smooth',block:'center'})});
</script>

<!-- Default Birthday Song Controller -->
<audio id="tempo-birthday-audio" loop preload="auto" src="/music/happy-birthday.mp3"></audio>
<script>
  (function() {
    // If not already controlled by parent iframe
    if (window.self === window.top) {
      window.addEventListener('click', function() {
        const a = document.getElementById('tempo-birthday-audio');
        if (a && a.paused) {
          a.play().catch(function() {});
        }
      }, { once: true });
    }
  })();
</script>

</body></html>
