box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;background:var(--sky)}
body{margin:0;background:var(--sky);color:var(--ink);font:500 16px/1.55 Montserrat,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit}
nav{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:10px clamp(12px,3vw,32px);z-index:6;font-size:12px}
nav div{display:flex;gap:clamp(12px,3vw,24px)}nav a{text-decoration:none}
.pill{background:var(--ink);color:var(--sky);padding:4px 12px;border-radius:99px;font-weight:700}
.hero{--H:max(560px,min(100svh,170vw));--ph:min(calc(var(--H)*.72),100vw);--bw:min(98vw,1150px);position:relative;height:var(--H);overflow:hidden}
.hero>*{position:absolute}
.tag{display:none;left:0;right:0;top:56px;text-align:center;font:700 30px/1 Caveat,cursive;rotate:-3deg;z-index:3}
.pp{width:calc(var(--bw)*.36);aspect-ratio:1.3;background:var(--paper) 50% 50%/170% auto;z-index:0;top:calc(var(--H) - var(--ph)*.7 - var(--bw)*.1465 - 14px);
clip-path:polygon(2% 7%,13% 2%,27% 8%,42% 1%,58% 7%,75% 2%,90% 8%,98% 3%,100% 30%,96% 52%,100% 75%,97% 97%,80% 100%,63% 94%,45% 100%,27% 95%,10% 100%,0 91%,3% 70%,0 47%,4% 25%)}
.pp::after{content:"";position:absolute;width:26%;height:15%;top:3%;left:37%;background:#f2b79bcc;rotate:-5deg}
.pl{left:-3vw;rotate:-5deg}.pr{right:-3vw;top:calc(var(--H) - var(--ph)*.7 - var(--bw)*.1465 + 22px);rotate:4deg}
.box{left:50%;bottom:0;height:var(--ph);aspect-ratio:477/662;translate:-50% 0}
.fl{z-index:1}.person{z-index:4;background:var(--per) center bottom/contain no-repeat;animation:fade 1s .2s both;
filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 12px 16px #0003)}
.sun{position:absolute;bottom:-4%;width:86%;aspect-ratio:620/593;background:var(--sun) center/contain no-repeat}
.s1{left:-44%;rotate:-10deg}.s2{right:-44%;rotate:14deg}
.bd{z-index:2;width:var(--bw);aspect-ratio:1000/293;left:50%;translate:-50% 0;background:var(--bd) center/contain no-repeat;top:calc(var(--H) - var(--ph)*.7 - var(--bw)*.1465);animation:pop .9s both,sway 6s 1s ease-in-out infinite}
.hp{z-index:3;width:min(44vw,280px);aspect-ratio:685/305;left:50%;translate:-50% 0;bottom:calc(var(--ph) + 4px);background:var(--hp) center/contain no-repeat;animation:pop .8s .1s both,sway 4.5s 1s ease-in-out infinite reverse}
@keyframes pop{from{opacity:0;scale:.85}}@keyframes fade{from{opacity:0}}
@keyframes sway{0%,100%{rotate:-1.2deg}50%{rotate:1.2deg}}
@media(max-width:700px){.tag{display:block}}
.mq{background:var(--ink);color:var(--sky);overflow:hidden;white-space:nowrap;padding:12px 0;font:700 clamp(18px,3vw,26px)/1 Montserrat,sans-serif}
.mqi{display:flex;width:max-content;align-items:center;animation:mq 30s linear infinite}
.mqi span{margin-right:28px}.mqi i{width:26px;aspect-ratio:1;margin-right:28px;background:var(--sun) center/contain no-repeat}
@keyframes mq{to{translate:-50% 0}}
.sec{padding:clamp(56px,9vw,110px) 20px;display:flex;flex-direction:column;align-items:center}
h2{font:700 clamp(30px,6vw,46px)/1.1 Montserrat,sans-serif;margin:0 0 28px;text-align:center}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em}.w>span{display:inline-block;transition:translate .7s cubic-bezier(.2,.8,.2,1)}
.js h2 .w>span{translate:0 110%}.js h2.in .w>span{translate:0 0}.w:nth-child(2)>span{transition-delay:.12s}
.note{width:min(100%,540px);container-type:inline-size}
.paper{background:var(--paper) center/100% 100% no-repeat;filter:drop-shadow(0 14px 20px #0003);padding:17cqw 12cqw 11cqw;color:#2b2418;text-align:center}
.paper>*{margin:0}
.paper h3{font:700 11cqw/1 Caveat,cursive}
.paper .to{font:600 6.4cqw/1.15 Caveat,cursive;margin-top:2cqw}
.paper .d{margin-top:5cqw;font-size:max(13px,3.7cqw);line-height:1.5}
.paper .d b{display:block;font-size:max(15px,4.2cqw)}
.paper a{display:inline-block;margin-top:4cqw;font-size:max(13px,3.4cqw);font-weight:700}
.js .paper>*{opacity:0;translate:0 16px;transition:opacity .6s,translate .6s}.js .paper.in>*{opacity:1;translate:none}
.paper>:nth-child(2){transition-delay:.15s!important}.paper>:nth-child(3){transition-delay:.3s!important}.paper>:nth-child(4){transition-delay:.45s!important}.paper>:nth-child(5){transition-delay:.6s!important}
.card{width:min(100%,560px);background:#fff;border-radius:28px;padding:clamp(18px,5vw,36px);box-shadow:0 18px 40px #0002}
label.f{display:block;font-size:14px;font-weight:700;margin:0 0 16px}
input[type=text],select,textarea{display:block;width:100%;margin-top:6px;font:inherit;color:var(--ink);background:#fff;border:2px solid #0a0a0a2a;border-radius:12px;padding:11px 14px}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
fieldset{border:0;padding:0;margin:0 0 16px;display:flex;flex-wrap:wrap;gap:8px}
legend{font-size:14px;font-weight:700;margin-bottom:8px;padding:0}
.opt{position:relative}.opt input{position:absolute;opacity:0;inset:0}
.opt span{display:block;padding:10px 16px;border:2px solid #0a0a0a2a;border-radius:99px;font-size:14px;cursor:pointer}
.opt input:checked+span{background:var(--gold);border-color:var(--gold);font-weight:700}
.opt input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.btn{display:inline-block;border:0;border-radius:99px;background:var(--ink);color:var(--sky);font:700 16px Montserrat,sans-serif;padding:14px 26px;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:12px 22px}
#out{display:none;margin-top:20px}#out.on{display:block}#out textarea{min-height:120px;font-size:14px}
#out .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.gal{padding-left:0;padding-right:0}.rail{overflow:hidden;width:100%;padding:16px 0}
.track{display:flex;width:max-content;animation:mq 45s linear infinite}.track.rev{animation-direction:reverse;animation-duration:55s}
.rail:hover .track,.rail:focus-within .track{animation-play-state:paused}
.tile{flex:none;width:clamp(170px,44vw,240px);margin-right:22px;border:0;background:#fff;padding:10px 10px 38px;rotate:var(--r);box-shadow:0 12px 26px #0003;cursor:zoom-in;transition:rotate .25s,scale .25s}
.tile:hover{rotate:0deg;scale:1.06}
.ph{display:block;aspect-ratio:1;background:var(--bg);position:relative;overflow:hidden}
.ph i{position:absolute;inset:0;background:var(--per) var(--x) no-repeat;background-size:auto var(--z);scale:var(--fl,1) 1}
.ph b{position:absolute;width:42%;aspect-ratio:620/593;background:var(--sun) center/contain no-repeat;right:-8%;bottom:-8%;rotate:20deg}
dialog{border:0;padding:14px;background:#fff;width:min(92vw,520px);box-shadow:0 30px 80px #0008}dialog::backdrop{background:#000a}
.end{text-align:center;padding:10px 20px 50px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js h2 .w>span{translate:none}.js .paper>*{opacity:1;translate:none}html{scroll-behavior:auto}.rail{overflow-x:auto}}
</style>
<style id="tempo-responsive-override">
  html, body {
    max-width: 100vw !important;
    overflow-x: hidden !important;
    box-sizing: border-box !important;
  }
  *, *::before, *::after {
    box-sizing: border-box !important;
  }
  /* Prevent animated ping or oversized elements from overflowing viewport */
  .animate-ping {
    max-width: 100% !important;
  }
</style>

</head><body>
<section class="hero">
<nav><div><a href="#invite">Invite</a><a href="#rsvp">RSVP</a><a href="#gallery">Gallery</a></div><a class="pill" href="#rsvp">RSVP</a></nav>
<p class="tag">You are invited!</p>
<i class="pp pl"></i><i class="pp pr"></i>
<div class="box fl"><i class="sun s1"></i><i class="sun s2"></i></div>
<div class="bd" role="img" aria-label="Birthday"></div><div class="hp" role="img" aria-label="Happy"></div>
<div class="box person" role="img" aria-label="The birthday person"></div>
</section>
<div class="mq" aria-hidden="true"><div class="mqi" id="mq"></div></div>

<section class="sec" id="invite"><div class="note"><div class="paper">
<h3>You are invited!</h3>
<p class="to">to celebrate <span data-b="name"></span>'s birthday</p>
<p class="d"><b data-b="date"></b><span data-b="time"></span></p>
<p class="d"><b data-b="venue"></b><span data-b="address"></span></p>
<a id="map" target="_blank" rel="noopener">Open in Maps</a>
</div></div></section>

<section class="sec" id="rsvp"><h2>Will you come?</h2>
<div class="card"><form id="f">
<label class="f">Your name<input type="text" id="n" required autocomplete="name"></label>
<fieldset><legend>Your answer</legend>
<label class="opt"><input type="radio" name="r" value="I'll be there" checked><span>I'll be there</span></label>
<label class="opt"><input type="radio" name="r" value="Maybe"><span>Maybe</span></label>
<label class="opt"><input type="radio" name="r" value="Can't make it"><span>Can't make it</span></label></fieldset>
<label class="f">How many people are coming?<select id="g"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
<label class="f">A note for <span data-b="name"></span> (optional)<textarea id="m"></textarea></label>
<button class="btn" type="submit">Create my RSVP</button></form>
<div id="out" aria-live="polite"><label class="f">Your RSVP is ready. Send it to the host:<textarea id="msg" readonly></textarea></label>
<div class="row"><a class="btn" id="wa" target="_blank" rel="noopener">Send on WhatsApp</a><button class="btn alt" id="cp" type="button">Copy message</button></div></div>
</div></section>

<section class="sec gal" id="gallery"><h2>Gallery</h2>
<div class="rail"><div class="track" id="t1"></div></div><div class="rail"><div class="track rev" id="t2"></div></div></section>
<dialog id="dlg"><div class="ph" id="big"></div></dialog>
<p class="end">See you there!</p>
<script>
document.documentElement.classList.add('js');
const C={name:'Your Name',date:'Saturday, 24 October 2026',time:'7:00 PM',venue:'Sunflower Terrace',address:'12 Garden Road, Agra, Uttar Pradesh 282001',phone:''};
const G=[{bg:'#ffd84d',z:'100%',x:'50%',s:1},{bg:'#b8f0d0',z:'270%',x:'50% 4%'},{bg:'#ffc9b0',z:'100%',x:'50%',fl:-1,s:1},{bg:'#d9c9ff',z:'240%',x:'46% 6%',fl:-1},{bg:'#9bedff',z:'170%',x:'50% 0%'},{bg:'#fff1c2',z:'100%',x:'50%',s:1},{bg:'#ffb3c7',z:'250%',x:'54% 5%'},{bg:'#c8e6ff',z:'100%',x:'50%',fl:-1}];
document.querySelectorAll('[data-b]').forEach(e=>e.textContent=C[e.dataset.b]);
map.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(C.venue+', '+C.address);
const tile=g=>`<span class="ph" style="--bg:${g.bg};--z:${g.z};--x:${g.x};--fl:${g.fl||1}"><i></i>${g.s?'<b></b>':''}</span>`;
const row=(a)=>{const h=a.map(g=>`<button class="tile" data-i="${G.indexOf(g)}" style="--r:${(G.indexOf(g)%2?2.5:-2.5)}deg" aria-label="Open photo">${tile(g)}</button>`).join('');return h+h};
t1.innerHTML=row(G);t2.innerHTML=row([...G].reverse());
document.getElementById('gallery').onclick=e=>{const b=e.target.closest('.tile');if(b){big.outerHTML=tile(G[b.dataset.i]).replace('class="ph"','class="ph" id="big"');dlg.showModal()}};
dlg.onclick=()=>dlg.close();
const u=`<span>Happy Birthday ${C.name}</span><i></i>`.repeat(6);mq.innerHTML=u+u;
document.querySelectorAll('h2').forEach(h=>{h.innerHTML=h.textContent.split(' ').map(w=>`<span class="w"><span>${w}</span></span>`).join(' ')});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.25});
document.querySelectorAll('h2,.paper').forEach(e=>io.observe(e));
f.onsubmit=e=>{e.preventDefault();
const t=`Hi! RSVP for ${C.name}'s birthday (${C.date}, ${C.time})\nName: ${n.value.trim()}\nAnswer: ${document.querySelector('[name=r]:checked').value}\nPeople: ${g.value}`+(m.value.trim()?`\nNote: ${m.value.trim()}`:'');
msg.value=t;wa.href='https://wa.me/'+C.phone+'?text='+encodeURIComponent(t);out.classList.add('on');out.scrollIntoView({block:'nearest'})};
cp.onclick=async()=>{try{await navigator.clipboard.writeText(msg.value);cp.textContent='Copied'}catch(_){msg.select();cp.textContent='Select and copy the text'}};
</script>
<!-- Default Birthday Song Controller -->
<audio id="tempo-birthday-audio" loop preload="auto" src="/music/happy-birthday.mp3"></audio>
<script>
  (function() {
    // If not already controlled by parent iframe
    if (window.self === window.top) {
      window.addEventListener('click', function() {
        const a = document.getElementById('tempo-birthday-audio');
        if (a && a.paused) {
          a.play().catch(function() {});
        }
      }, { once: true });
    }
  })();
</script>

</body></html>
