<script>
(() => {
  const pCanvas = document.getElementById('lux-particles');
  const pCtx = pCanvas?.getContext('2d');
  let pWidth = 0, pHeight = 0;
  const particles = [];
  const P_COUNT = 38;

  const resizeParticles = () => {
    if (!pCanvas) return;
    pWidth = pCanvas.width = pCanvas.parentElement.clientWidth;
    pHeight = pCanvas.height = pCanvas.parentElement.clientHeight;
  };

  const createParticles = () => {
    particles.length = 0;
    for (let i = 0; i < P_COUNT; i++) {
      particles.push({
        x: Math.random() * (pWidth || 800),
        y: Math.random() * (pHeight || 600),
        radius: Math.random() * 1.4 + 0.4,
        alpha: Math.random() * 0.45 + 0.1,
        vx: (Math.random() - 0.5) * 0.2,
        vy: -Math.random() * 0.35 - 0.1,
        color: Math.random() > 0.4 ? '221, 183, 255' : '76, 215, 246'
      });
    }
  };

  const drawParticles = () => {
    if (!pCtx || !pWidth) return;
    pCtx.clearRect(0, 0, pWidth, pHeight);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.y < 0) p.y = pHeight + 5;
      if (p.x < 0) p.x = pWidth + 5;
      if (p.x > pWidth) p.x = 0;

      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      pCtx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
      pCtx.shadowBlur = 10;
      pCtx.shadowColor = `rgba(${p.color}, 0.8)`;
      pCtx.fill();
    });
    requestAnimationFrame(drawParticles);
  };

  window.addEventListener('resize', () => {
    resizeParticles();
  });
  resizeParticles();
  createParticles();
  drawParticles();

  const cCanvas = document.getElementById('confetti-canvas');
  const cCtx = cCanvas?.getContext('2d');
  let cWidth = 0, cHeight = 0;
  let confetti = [];
  let isConfettiRunning = false;

  const resizeConfetti = () => {
    if (!cCanvas) return;
    cWidth = cCanvas.width = cCanvas.parentElement.clientWidth;
    cHeight = cCanvas.height = cCanvas.parentElement.clientHeight;
  };
  window.addEventListener('resize', resizeConfetti);
  resizeConfetti();

  const confettiColors = [
    { fill: '#ddb7ff', shimmer: '#f0dbff' },
    { fill: '#4cd7f6', shimmer: '#acedff' },
    { fill: '#b76dff', shimmer: '#ddb7ff' },
    { fill: '#ffffff', shimmer: '#e5e1e4' },
    { fill: '#03b5d3', shimmer: '#4cd7f6' }
  ];

  class ConfettiPiece {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      const angle = Math.random() * Math.PI * 2;
      const velocity = Math.random() * 18 + 7;
      this.vx = Math.cos(angle) * velocity;
      this.vy = Math.sin(angle) * velocity - 9;
      this.gravity = 0.38;
      this.drag = 0.94;
      this.size = Math.random() * 8 + 6;
      this.palette = confettiColors[Math.floor(Math.random() * confettiColors.length)];
      this.rotationX = Math.random() * 360;
      this.rotationY = Math.random() * 360;
      this.rotSpeedX = (Math.random() - 0.5) * 16;
      this.rotSpeedY = (Math.random() - 0.5) * 16;
      this.life = 1;
      this.decay = Math.random() * 0.009 + 0.007;
    }

    update() {
      this.vx *= this.drag;
      this.vy = (this.vy + this.gravity) * this.drag;
      this.x += this.vx;
      this.y += this.vy;
      this.rotationX += this.rotSpeedX;
      this.rotationY += this.rotSpeedY;
      this.life -= this.decay;
    }

    draw(ctx) {
      if (this.life <= 0) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(Math.cos(this.rotationX * Math.PI / 180), Math.sin(this.rotationY * Math.PI / 180));
      ctx.globalAlpha = Math.max(0, this.life);
      ctx.fillStyle = this.palette.fill;
      ctx.shadowColor = this.palette.shimmer;
      ctx.shadowBlur = 8;
      ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.65);
      ctx.restore();
    }
  }

  const fireConfetti = (originX, originY) => {
    resizeConfetti();
    for (let i = 0; i < 160; i++) {
      confetti.push(new ConfettiPiece(originX, originY));
    }
    if (!isConfettiRunning) {
      isConfettiRunning = true;
      animateConfetti();
    }
  };

  const animateConfetti = () => {
    if (!cCtx || !cWidth) return;
    cCtx.clearRect(0, 0, cWidth, cHeight);
    confetti = confetti.filter(p => p.life > 0);
    confetti.forEach(p => {
      p.update();
      p.draw(cCtx);
    });

    if (confetti.length > 0) {
      requestAnimationFrame(animateConfetti);
    } else {
      isConfettiRunning = false;
      cCtx.clearRect(0, 0, cWidth, cHeight);
    }
  };

  const rsvpBtn = document.getElementById('rsvp-btn');
  const rsvpBtnText = document.getElementById('rsvp-btn-text');
  const statusCard = document.getElementById('status-card');
  const halo = document.getElementById('rsvp-halo');

  let confirmed = false;

  rsvpBtn?.addEventListener('click', (e) => {
    const rect = cCanvas.getBoundingClientRect();
    const btnRect = rsvpBtn.getBoundingClientRect();
    const originX = btnRect.left + btnRect.width / 2 - rect.left;
    const originY = btnRect.top + btnRect.height / 2 - rect.top;

    fireConfetti(originX, originY);

    if (!confirmed) {
      confirmed = true;
      rsvpBtnText.textContent = 'ACCESS GRANTED';
      rsvpBtn.classList.add('bg-surface-container', 'text-secondary');
      if (halo) halo.classList.add('opacity-90', 'blur-2xl');

      if (statusCard) {
        statusCard.classList.remove('hidden');
        setTimeout(() => {
          statusCard.classList.remove('opacity-0', 'translate-y-3');
          statusCard.classList.add('opacity-100', 'translate-y-0');
        }, 50);
      }
    }
  });
})();
</script>
