@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#1d1310}}
:root[data-theme=dark]{--page:#1d1310}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--page);color:var(--ink);font-family:var(--serif);-webkit-text-size-adjust:100%}
body{display:grid;place-items:center}
button,a,input{font:inherit;touch-action:manipulation}
.stage{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;isolation:isolate;container-type:size;background:#d9b49c}
@media(min-aspect-ratio:3/4){.stage{width:calc(100vh*9/16);width:calc(100dvh*9/16);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}}

/* invitation (behind the doors) */
.invite{position:absolute;inset:0;z-index:1;visibility:hidden}
.is-open .invite{visibility:visible}
.opening .invite{animation:push 2.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes push{from{transform:scale(1.14)}to{transform:none}}
.inv-bg{position:absolute;inset:-4%;background:var(--bg) center/cover;animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.07)}}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(255,240,228,.3),rgba(120,70,48,.3))}
.scroll{position:absolute;inset:0;display:flex;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.scroll::-webkit-scrollbar{display:none}
.card{margin:auto;width:min(100%,380px);text-align:center;padding:clamp(54px,10vh,84px) 26px 34px;border-radius:50% 50% 22px 22px/120px 120px 22px 22px;background:linear-gradient(180deg,rgba(255,248,241,.94),rgba(248,229,216,.93));border:1px solid rgba(185,132,103,.55);box-shadow:0 34px 60px -26px rgba(74,44,32,.7),inset 0 0 0 7px rgba(255,248,242,.55),inset 0 0 0 8px rgba(185,132,103,.28)}
.fl{display:block;width:34px;height:34px;margin:0 auto 8px;color:var(--gold)}
h1{margin:0 0 6px;font:600 clamp(2rem,9vw,2.5rem)/1.05 var(--serif);letter-spacing:.01em}
h1:focus{outline:none}
.sub{margin:0;font:italic 500 1.25rem/1.3 var(--serif);color:var(--cocoa)}
.orn{display:flex;align-items:center;gap:10px;width:68%;margin:14px auto 8px;color:var(--gold)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor)}
.orn::after{transform:scaleX(-1)}
.orn svg{width:16px;height:16px}
.name{margin:0;font:400 clamp(2.6rem,14vw,3.9rem)/1.15 var(--script);overflow-wrap:anywhere}
.det{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px}
.det li{display:flex;align-items:center;justify-content:center;gap:10px;font:500 1.2rem/1.3 var(--serif)}
.det svg{flex:none;width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.msg{margin:22px auto 0;max-width:28ch;font:italic 500 1.15rem/1.55 var(--serif);color:var(--cocoa)}
.acts{display:grid;justify-items:center;gap:12px;margin-top:26px}
.acts .btn{width:min(100%,270px)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border:1px solid transparent;border-radius:999px;font:600 1.2rem/1 var(--serif);letter-spacing:.04em;text-decoration:none;cursor:pointer;transition:transform .2s,filter .3s,background .3s}
.btn:active{transform:scale(.97)}
.main{color:var(--cream);background:linear-gradient(180deg,#9a6a52,#6e4331);border-color:rgba(255,226,205,.4);box-shadow:0 12px 24px -10px rgba(74,44,32,.8),inset 0 1px 0 rgba(255,230,210,.35)}
.alt{color:var(--ink);background:rgba(255,250,245,.5);border-color:rgba(138,90,68,.55)}
.btn:focus-visible,.skip:focus-visible,.x:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(hover:hover){.main:hover{filter:brightness(1.1)}.alt:hover{background:rgba(255,250,245,.95)}}

/* opening screen: doors + controls */
.glow{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse 45% 60% at 50% 50%,rgba(255,238,214,.95),rgba(255,214,180,0) 70%)}
.opening .glow{animation:bloom 2.8s ease-out forwards}
@keyframes bloom{30%{opacity:.95}to{opacity:0}}
.doors{position:absolute;inset:0;z-index:3;overflow:hidden;perspective:1500px;pointer-events:none}
.door{position:absolute;top:0;bottom:0;width:50.2%;overflow:hidden;backface-visibility:hidden;will-change:transform}
.door.l{left:0;transform-origin:0 50%}.door.r{right:0;transform-origin:100% 50%}
.face{position:absolute;top:0;height:100%;width:199.2%;background:var(--door) center/cover}
.l .face{left:0}.r .face{right:0}
.door::after{content:"";position:absolute;inset:0;background:rgba(54,28,18,.6);opacity:0}
.doors::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,240,230,.3) 50%,transparent 60%);transform:translateX(-120%);animation:sheen 6.5s ease-in-out 1s infinite}
@keyframes sheen{40%,100%{transform:translateX(120%)}}
.opening .doors::after{animation:none;opacity:0}
.opening .l{animation:swl 2.4s cubic-bezier(.7,0,.2,1) .1s forwards}
.opening .r{animation:swr 2.4s cubic-bezier(.7,0,.2,1) .1s forwards}
@keyframes swl{to{transform:rotateY(-97deg)}}
@keyframes swr{to{transform:rotateY(97deg)}}
.opening .door::after{animation:dim 2.4s ease-in .1s forwards}
@keyframes dim{to{opacity:1}}
.done .doors,.done .glow,.done .ui,.done .tap{display:none}
.ui{position:absolute;inset:auto 0 0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;padding:60px 20px calc(env(safe-area-inset-bottom,0px) + 5vh);background:linear-gradient(to top,rgba(238,205,184,.88),rgba(238,205,184,0));transition:opacity .5s,transform .6s}
.is-open .ui{opacity:0;transform:translateY(14px);pointer-events:none}
.is-open .tap{opacity:0;pointer-events:none}
.skipped .ui,.skipped .tap{display:none}
.tap{position:absolute;z-index:6;left:50%;top:46.2%;width:76px;height:112px;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;cursor:pointer;transition:opacity .4s}
.tap{top:calc(50cqh - .038*max(100cqh,177.9cqw));width:max(64px,calc(.14*max(100cqw,56.2cqh)));height:max(96px,calc(.13*max(100cqh,177.9cqw)))}
.tap::before,.tap::after{content:"";position:absolute;inset:-8px;border:1.5px solid rgba(255,244,234,.95);border-radius:50%;box-shadow:0 0 14px rgba(255,236,220,.8);opacity:0;animation:ping 2.8s ease-out infinite}
.tap::after{animation-delay:1.4s}
@keyframes ping{0%{transform:scale(.88);opacity:.9}to{transform:scale(1.5);opacity:0}}
.tap span{position:absolute;top:calc(100% + 20px);left:50%;transform:translateX(-50%);white-space:nowrap;font:italic 600 1.3rem/1 var(--serif);letter-spacing:.05em;color:var(--ink);text-shadow:0 0 12px rgba(255,236,224,.95),0 0 4px rgba(255,236,224,.9)}
.tap:focus-visible{outline:2px solid var(--ink);outline-offset:8px}
.skip{min-height:44px;padding:0 20px;border:0;background:none;color:var(--ink);font:500 1.15rem var(--serif);letter-spacing:.06em;cursor:pointer;text-shadow:0 0 12px rgba(255,236,224,.95)}
.skip:hover,.skip:focus-visible{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}

/* content reveal */
.rv{opacity:0}
.is-open .rv{animation:rise .9s var(--ease) both;animation-delay:calc(var(--base,0s) + var(--i,0)*.13s)}
.opening{--base:1.3s}
.skipped .rv{animation-duration:.5s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* RSVP sheet */
.wrap{position:absolute;inset:0;z-index:8;display:flex;align-items:flex-end;background:rgba(58,32,22,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.wrap.on{opacity:1;visibility:visible}
.sheet{position:relative;width:100%;max-height:92%;overflow-y:auto;padding:30px 24px calc(env(safe-area-inset-bottom,0px) + 26px);text-align:center;background:linear-gradient(180deg,#fff8f1,#f6e1d3);border-radius:28px 28px 0 0;box-shadow:0 -20px 50px rgba(58,32,22,.35);transform:translateY(100%);transition:transform .55s var(--ease)}
.on .sheet{transform:none}
.sheet h2{margin:0 0 4px;font:600 1.9rem/1.1 var(--serif)}
.sheet p{margin:0 0 18px;font:italic 500 1.15rem/1.4 var(--serif);color:var(--cocoa)}
.sheet p.err{min-height:1.3em;margin:0 0 8px;font-style:normal;color:#a3382a}
.x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--ink);font-size:1.8rem;cursor:pointer}
.fld{display:block;margin:0 0 14px;text-align:left;font-weight:600;font-size:1.1rem}
.fld input[type=text]{display:block;width:100%;height:52px;margin-top:6px;padding:0 16px;border:1px solid rgba(138,90,68,.5);border-radius:14px;background:#fffaf5;color:var(--ink);font-size:1.1rem;font-weight:500}
.fld input[type=text]:focus{outline:2px solid var(--cocoa);outline-offset:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.seg label{position:relative}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:52px;border:1px solid rgba(138,90,68,.5);border-radius:14px;background:#fffaf5;font-weight:600;font-size:1.2rem;transition:.25s}
.seg input:checked+span{background:#6e4331;border-color:#6e4331;color:var(--cream)}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:3px}

@media(prefers-reduced-motion:reduce){
.door{transition:opacity .5s}.opening .door{animation:none!important;opacity:0}
.inv-bg,.tap::before,.tap::after,.doors::after{animation:none}.opening .invite{animation:none}
.is-open .rv{animation-duration:.01s;animation-delay:0s}}
</style>

<style id="tempo-responsive-override">
  html, body {
    max-width: 100vw !important;
    overflow-x: hidden !important;
    box-sizing: border-box !important;
  }
  *, *::before, *::after {
    box-sizing: border-box !important;
  }
  /* Prevent animated ping or oversized elements from overflowing viewport */
  .animate-ping {
    max-width: 100% !important;
  }
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="fl" viewBox="-12 -12 24 24"><g fill="none" stroke="currentColor" stroke-width="1"><ellipse cy="-6" rx="3.2" ry="5.5"/><ellipse cy="-6" rx="3.2" ry="5.5" transform="rotate(72)"/><ellipse cy="-6" rx="3.2" ry="5.5" transform="rotate(144)"/><ellipse cy="-6" rx="3.2" ry="5.5" transform="rotate(216)"/><ellipse cy="-6" rx="3.2" ry="5.5" transform="rotate(288)"/><circle r="1.7" fill="currentColor" stroke="none"/></g></symbol>
<symbol id="cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
<symbol id="clk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
</defs></svg>

<main class="stage" id="stage">
  <section class="invite" id="invite">
    <div class="inv-bg"></div><div class="veil"></div>
    <div class="scroll"><article class="card">
      <svg class="fl rv" style="--i:0" aria-hidden="true"><use href="#fl"/></svg>
      <h1 class="rv" style="--i:1" id="title" tabindex="-1">You’re Invited!</h1>
      <p class="sub rv" style="--i:2">A Special Birthday Celebration</p>
      <div class="orn rv" style="--i:3" aria-hidden="true"><svg><use href="#fl"/></svg></div>
      <h2 class="name rv" style="--i:4" data-k="name">Birthday Star</h2>
      <ul class="det">
        <li class="rv" style="--i:5"><svg aria-hidden="true"><use href="#cal"/></svg><span data-k="date">Add Birthday Date</span></li>
        <li class="rv" style="--i:6"><svg aria-hidden="true"><use href="#clk"/></svg><span data-k="time">Add Event Time</span></li>
        <li class="rv" style="--i:7"><svg aria-hidden="true"><use href="#pin"/></svg><span data-k="venue">Add Venue Details</span></li>
      </ul>
      <p class="msg rv" style="--i:8" data-k="message">Join us for a day filled with love, laughter, cake, and unforgettable memories!</p>
      <div class="acts rv" style="--i:9">
        <button class="btn main" id="rsvp" type="button">RSVP Now</button>
        <a class="btn alt" id="map" target="_blank" rel="noopener noreferrer">View Location</a>
      </div>
    </article></div>
  </section>

  <div class="glow"></div>
  <div class="doors" aria-hidden="true"><div class="door l"><i class="face"></i></div><div class="door r"><i class="face"></i></div></div>
  <button class="tap" id="intro" type="button" aria-label="Open the invitation"><span>Click here</span></button>
  <div class="ui">
    <button class="skip" id="skip" type="button">Skip</button>
  </div>

  <div class="wrap" id="wrap">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rt">
      <button class="x" id="rx" type="button" aria-label="Close">&times;</button>
      <div id="rform">
        <h2 id="rt">RSVP</h2><p>Let us know if you can make it.</p>
        <label class="fld">Name<input type="text" id="rn" autocomplete="name" placeholder="Your name" maxlength="60"></label>
        <div class="fld" role="radiogroup" aria-label="Attendance">Attendance
          <div class="seg"><label><input type="radio" name="att" value="Yes"><span>Yes</span></label><label><input type="radio" name="att" value="No"><span>No</span></label></div>
        </div>
        <p class="err" id="re" role="alert"></p>
        <button class="btn main" id="rs" type="button">Submit</button>
      </div>
      <div id="rdone" hidden>
        <h2 id="rh"></h2><p id="rm"></p>
        <div class="acts"><a class="btn main" id="rw" target="_blank" rel="noopener noreferrer" hidden>Send on WhatsApp</a><button class="btn alt" id="rc" type="button">Close</button></div>
      </div>
    </div>
  </div>
</main>

<script>
/* ===== Edit these details ===== */
const CONFIG = {
  name: "Birthday Star",
  date: "Add Birthday Date",
  time: "Add Event Time",
  venue: "Add Venue Details",
  message: "Join us for a day filled with love, laughter, cake, and unforgettable memories!",
  mapUrl: "https://www.google.com/maps/search/?api=1&query=Add+Venue+Details",
  rsvpWhatsApp: "" /* optional, digits with country code e.g. "919876543210": guests get a "Send on WhatsApp" button after RSVP */
};

const $ = id => document.getElementById(id), st = $('stage');
document.querySelectorAll('[data-k]').forEach(e => e.textContent = CONFIG[e.dataset.k]);
$('map').href = CONFIG.mapUrl;

/* Intro / Skip */
let state = 'closed';
function finish() { st.classList.add('done'); $('title').focus({preventScroll: true}); }
function reveal(mode) {
  if (state !== 'closed') return;
  state = mode;
  if (mode === 'intro') { st.classList.add('opening', 'is-open'); setTimeout(finish, 2800); }
  else { st.classList.add('skipped', 'is-open'); finish(); }
}
$('intro').onclick = () => reveal('intro');
$('skip').onclick = () => reveal('skip');

/* RSVP */
const wrap = $('wrap'), nm = $('rn');
function openR() {
  $('rform').hidden = false; $('rdone').hidden = true; $('re').textContent = '';
  wrap.classList.add('on'); setTimeout(() => nm.focus({preventScroll: true}), 350);
}
function closeR() { wrap.classList.remove('on'); $('rsvp').focus({preventScroll: true}); }
$('rsvp').onclick = openR;
$('rx').onclick = $('rc').onclick = closeR;
wrap.addEventListener('click', e => { if (e.target === wrap) closeR(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && wrap.classList.contains('on')) closeR(); });
nm.addEventListener('keydown', e => { if (e.key === 'Enter') $('rs').click(); });
$('rs').onclick = () => {
  const n = nm.value.trim(), a = document.querySelector('input[name=att]:checked'), err = $('re');
  if (!n) { err.textContent = 'Please enter your name.'; nm.focus(); return; }
  if (!a) { err.textContent = 'Please choose Yes or No.'; return; }
  try { /* saved on this device only; use the WhatsApp option above (or your own backend) to receive replies */
    const k = 'rsvp-responses', l = JSON.parse(localStorage.getItem(k) || '[]');
    l.push({name: n, attending: a.value, at: new Date().toISOString()});
    localStorage.setItem(k, JSON.stringify(l));
  } catch (_) {}
  $('rh').textContent = 'Thank you, ' + n + '!';
  $('rm').textContent = a.value === 'Yes' ? 'Your RSVP is in. We can’t wait to celebrate with you!' : 'Thank you for letting us know. You will be missed!';
  const w = $('rw'), num = CONFIG.rsvpWhatsApp.replace(/\D/g, '');
  w.hidden = !num;
  if (num) w.href = 'https://wa.me/' + num + '?text=' + encodeURIComponent('Hi! This is ' + n + '. RSVP for ' + CONFIG.name + '’s birthday: ' + a.value);
  $('rform').hidden = true; $('rdone').hidden = false;
};
</script>

<!-- Default Birthday Song Controller -->
<audio id="tempo-birthday-audio" loop preload="auto" src="/music/happy-birthday.mp3"></audio>
<script>
  (function() {
    // If not already controlled by parent iframe
    if (window.self === window.top) {
      window.addEventListener('click', function() {
        const a = document.getElementById('tempo-birthday-audio');
        if (a && a.paused) {
          a.play().catch(function() {});
        }
      }, { once: true });
    }
  })();
</script>

</body>
</html>
