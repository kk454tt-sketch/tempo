<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web developer portfolio — 3D Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#c4701e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background-color:var(--bg);transition:background-color .9s ease;font-family:Rajdhani,'Arial Narrow',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero{position:relative;height:100%;min-height:520px;overflow:hidden;cursor:default}
.glow{position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 48%,rgba(255,255,255,.2),transparent 72%);pointer-events:none}
.nav{position:absolute;inset:0 0 auto 0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,4vw,56px);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.nav a{color:#fff;text-decoration:none}
.brand{display:flex;gap:10px;align-items:center;font-weight:700}
.brand i{width:26px;height:26px;border-radius:50%;background:#fff;display:block}
.links{display:flex;align-items:center;gap:clamp(16px,3vw,40px)}
.hire{border:1.5px solid #fff;border-radius:99px;padding:8px 18px;transition:background .25s,color .25s;cursor:pointer;background:transparent;color:#fff;font-family:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;text-transform:inherit}
.hire:hover{background:#fff;color:var(--bg)}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:4px}
.slide{position:absolute;inset:0;visibility:hidden;pointer-events:none}
.slide.on,.slide.out{visibility:visible}
.slide.on{pointer-events:auto}
.stage{position:absolute;inset:0;transform:perspective(1400px) rotateX(calc(var(--ty,0)*1deg)) rotateY(calc(var(--tx,0)*1deg));transition:transform .6s ease-out}
.word{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;justify-content:center;font:400 min(33vw,56svh)/.82 Anton,Impact,'Arial Narrow',sans-serif;color:#f7f6f2;user-select:none}
.word b{display:block;font-weight:400;transform:translateY(120%)}
.slide.on .word b{transform:none;transition:transform .9s cubic-bezier(.2,.8,.2,1) calc(.3s + var(--i)*60ms)}
.slide.out .word b{transition:transform .6s cubic-bezier(.6,0,.8,.2) calc(var(--i)*30ms)}
.char{position:absolute;left:50%;bottom:0;z-index:2;width:min(96vw,calc(var(--ar)*80svh));height:auto;transform:translate(-50%,105svh);pointer-events:none;user-select:none;filter:drop-shadow(0 30px 40px rgba(0,0,0,.22))}
.slide.on .char{transform:translate(-50%,0);transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .3s}
.slide.out .char{transform:translate(-50%,-105svh);transition:transform .8s cubic-bezier(.6,0,.8,.2)}
.meta,.side{position:absolute;z-index:4;top:clamp(96px,22svh,220px);opacity:0;transform:translateY(14px)}
.slide.on .meta,.slide.on .side{opacity:1;transform:none;transition:opacity .7s .7s,transform .7s .7s}
.slide.out .meta,.slide.out .side{transition:opacity .3s}
.meta{left:clamp(20px,4vw,56px);font-weight:600;font-size:clamp(13px,1.05vw,16px);line-height:1.55;letter-spacing:.04em;text-transform:uppercase}
.meta h2{margin:0 0 14px;font:600 clamp(20px,2.1vw,32px)/1.05 Rajdhani,sans-serif;letter-spacing:.02em}
.meta p{margin:0;opacity:.88}
.meta a{color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.meta .card-hire{display:inline-block;margin-top:14px;border:1.5px solid #fff;border-radius:99px;padding:6px 16px;color:#fff;text-decoration:none;font-weight:700;font-size:12px;background:rgba(0,0,0,0.25);transition:background .25s,color .25s}
.meta .card-hire:hover{background:#fff;color:var(--bg)}
.side{right:clamp(20px,4vw,56px);width:min(300px,26vw);font-weight:500;font-size:clamp(14px,1.1vw,17px);line-height:1.45}
.side p{margin:0}
.arrows{display:flex;gap:10px;margin-top:22px}
.arrows button{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center;transition:background .25s,color .25s}
.arrows button:hover{background:#fff;color:var(--bg)}
.arrows button[data-dir="-1"] svg{transform:rotate(180deg)}
.ring{position:fixed;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;border:1.5px solid #fff;border-radius:50%;pointer-events:none;z-index:9;opacity:0;transition:opacity .3s}
@media (hover:none){.ring{display:none}}
@media (max-width:760px){
.links a:not(.hire){display:none}
.meta{top:84px}
.side{top:84px;width:auto}
.side p{display:none}
.arrows{margin-top:0}
.word{font-size:min(34vw,40svh)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>

<main class="hero" id="hero">

// Default initial state
const defaultCards = [
  {
    name: 'Alex Rivers',
    role: 'Full-stack Developer',
    stack: ['React', 'Node.js', 'PostgreSQL', 'TypeScript', 'Tailwind CSS', 'Next.js'],
    word: 'LAUNCH',
    bg: '#c4701e',
    img: O,
    ar: 1.083,
    alt: '3D collectible figurine in streetwear with silver rings and grin',
    links: [
      { label: 'Website', url: 'https://alexrivers.dev' },
      { label: 'GitHub', url: 'https://github.com/alexrivers' },
      { label: 'Resume', url: '#hero' }
    ],
    phone: '+919876543210',
    desc: 'I design and build fast, accessible websites and web apps, from the first wireframe to the production deploy.'
  },
  {
    name: 'Kai Vance',
    role: 'Creative Frontend',
    stack: ['TypeScript', 'Three.js', 'GSAP', 'WebGL', 'React', 'UI Systems'],
    word: 'CODING',
    bg: '#2e7d32',
    img: G,
    ar: 0.675,
    alt: '3D character in oversized shiny lime-green puffer jacket with playful grin',
    links: [
      { label: 'GitHub Project', url: 'https://github.com/kaivance/threejs-motion-ui' },
      { label: 'Phone', url: 'tel:+919876543211' }
    ],
    phone: '+919876543211',
    desc: 'Interfaces that move well: animation, 3D and design systems that stay quick on a phone.'
  }
];

let S = [...defaultCards];
const hero = document.getElementById('hero');
const arrow = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function renderSlides() {
  // Remove existing slides if re-rendering
  hero.querySelectorAll('.slide').forEach(s => s.remove());

  const slidesHtml = S.map((s, idx) => `
    <section class="slide" style="--ar:${s.ar}" aria-label="${s.word}">
      <div class="stage">
        <div class="word" aria-hidden="true">${[...s.word].map((c,j)=>`<b style="--i:${j}">${c}</b>`).join('')}</div>
        <img class="char" src="${s.img}" alt="${s.alt}">
      </div>
      <div class="meta">
        <h2>${s.role.replace(' ', '<br>')}</h2>
        <p style="font-weight:700;font-size:1.15em;letter-spacing:0.06em;margin-bottom:8px;">${s.name}</p>
        <p style="font-size:0.85em;opacity:0.9;margin-bottom:8px;max-width:280px;line-height:1.4;">
          ${s.stack ? s.stack.map(st=>`<span style="display:inline-block;padding:2px 8px;margin:2px;background:rgba(0,0,0,0.3);border-radius:12px;border:1px solid rgba(255,255,255,0.2);">${st}</span>`).join('') : ''}
        </p>
        <p>${s.links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a>`).join(', ')}</p>
        <a href="javascript:void(0)" class="card-hire" data-card="${idx}">Hire ${s.name.split(' ')[0]} via WhatsApp ➔</a>
      </div>
      <div class="side">
        <p>${s.desc}</p>
        <div class="arrows">
          <button data-dir="-1" aria-label="Previous">${arrow}</button>
          <button data-dir="1" aria-label="Next">${arrow}</button>
        </div>
      </div>
    </section>
  `).join('');

  hero.insertAdjacentHTML('beforeend', slidesHtml);
}

renderSlides();

let el = [...hero.querySelectorAll('.slide')];
let cur = 0, busy = false, timer;
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

function updateHeader() {
  const current = S[cur];
  const brandName = document.getElementById('brandName');
  if (brandName) brandName.textContent = current.name;
}

function openWhatsApp(card) {
  const phone = (card.phone || '').replace(/[^\\d+]/g, '').replace(/^\\+/, '');
  const msg = encodeURIComponent(`Hi ${card.name}! I saw your 3D developer portfolio on Tempo and would love to discuss a project with you.`);
  const url = phone ? `https://wa.me/${phone}?text=${msg}` : `https://wa.me/?text=${msg}`;
  window.open(url, '_blank', 'noopener,noreferrer');
}

function go(n) {
  el = [...hero.querySelectorAll('.slide')];
  n = (n + S.length) % S.length;
  if (n === cur || busy) return;
  busy = true;
  const out = el[cur];
  out.classList.remove('on');
  out.classList.add('out');
  cur = n;
  el[cur].classList.add('on');
  document.documentElement.style.setProperty('--bg', S[cur].bg);
  updateHeader();
  setTimeout(() => {
    out.classList.remove('out');
    busy = false;
  }, 1150);
}

function auto() {
  clearInterval(timer);
  if (!reduce) timer = setInterval(() => go(cur + 1), 6500);
}

hero.addEventListener('click', e => {
  const b = e.target.closest('[data-dir]');
  if (b) {
    go(cur + +b.dataset.dir);
    auto();
  }
  const cardHire = e.target.closest('.card-hire');
  if (cardHire) {
    e.preventDefault();
    const idx = parseInt(cardHire.dataset.card, 10);
    openWhatsApp(S[idx]);
  }
});

document.getElementById('navHireBtn').addEventListener('click', () => {
  openWhatsApp(S[cur]);
});

addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { go(cur + 1); auto(); }
  if (e.key === 'ArrowLeft') { go(cur - 1); auto(); }
});

hero.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const r = hero.getBoundingClientRect();
  hero.style.setProperty('--tx', ((e.clientX - r.left) / r.width - .5) * 7);
  hero.style.setProperty('--ty', -((e.clientY - r.top) / r.height - .5) * 5);
});

hero.addEventListener('pointerleave', () => {
  hero.style.setProperty('--tx', 0);
  hero.style.setProperty('--ty', 0);
});

const ring = document.getElementById('ring');
let mx = 0, my = 0, rx = 0, ry = 0, seen = false;
addEventListener('mousemove', e => {
  mx = e.clientX;
  my = e.clientY;
  if (!seen) { seen = true; rx = mx; ry = my; ring.style.opacity = '1'; }
});

(function loop() {
  rx += (mx - rx) * .16;
  ry += (my - ry) * .16;
  ring.style.transform = `translate(${rx}px,${ry}px)`;
  requestAnimationFrame(loop);
})();

setTimeout(() => {
  el[0].classList.add('on');
  updateHeader();
  auto();
}, 80);

// Global Tempo Customization API window hook
window.__TEMPO_PORTFOLIO_CONFIG = {
  getCards: () => S,
  updateCard: (index, newCard) => {
    S[index] = { ...S[index], ...newCard };
    renderSlides();
    el = [...hero.querySelectorAll('.slide')];
    el[cur].classList.add('on');
    updateHeader();
  },
  goToCard: (index) => go(index)
};
</script>
